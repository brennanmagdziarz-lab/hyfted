    <!-- JAVASCRIPT: Automatically stops the audio precisely at 60 seconds -->
    <script>
        const audioPlayers = document.querySelectorAll('audio');

        audioPlayers.forEach(player => {
            player.addEventListener('timeupdate', function() {
                if (this.currentTime >= 60) {
                    this.pause();
                    this.currentTime = 0;
                    alert("Your 1-minute sample has finished!");
                }
            });
        });
    </script>
