<!-- MUSIC -->

<div class="music-item">

    <span class="music-title">
        Calm Music
    </span>

    <!-- ORIGINAL CALM MUSIC -->
    <audio id="calmAudio" preload="metadata">
        <source src="./calm-music.mp3.mp3" type="audio/mpeg">
    </audio>

    <button
        id="playButton"
        class="sound-button"
        onclick="toggleMusic()">

        <span id="playIcon" class="play-icon"></span>

        <span id="buttonText">
            Play Music
        </span>

    </button>


    <!-- NEW AUDIO SAMPLE -->
    <span class="music-title" style="margin-top:15px;">
        Lofi Music Sample
    </span>

    <audio id="lofiAudio" preload="metadata">
        <source src="./prettyjohn1-lofi-lofi-music_61sec-587180 2.mp3" type="audio/mpeg">
    </audio>

    <button
        id="lofiPlayButton"
        class="sound-button"
        onclick="toggleLofi()">

        <span id="lofiPlayIcon" class="play-icon"></span>

        <span id="lofiButtonText">
            Play Lofi Sample
        </span>

    </button>


    <!-- FULL SONGS BUTTON -->

    <button
        class="sound-button"
        onclick="window.location.href='page10.html'">

        Full-songs

    </button>


    <!-- PROGRESS BAR -->

    <div class="progress-container">

        <input
            id="progress"
            class="progress-bar"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
            oninput="seekMusic(this.value)"
        >

    </div>


    <!-- TIME -->

    <div class="time">

        <span id="currentTime">
            0:00
        </span>

        <span id="duration">
            0:00
        </span>

    </div>


    <!-- VOLUME -->

    <div class="volume-row">

        <span class="volume-label">
            Volume
        </span>

        <input
            id="volume"
            class="volume-slider"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
            oninput="changeVolume(this.value)"
        >

    </div>


    <div id="status" class="status">
        Ready
    </div>

</div>


<script>

/* NEW LOFI SAMPLE */

const lofiAudio =
    document.getElementById("lofiAudio");

const lofiPlayIcon =
    document.getElementById("lofiPlayIcon");

const lofiButtonText =
    document.getElementById("lofiButtonText");

lofiAudio.volume = 0.5;


/* PLAY / PAUSE LOFI */

function toggleLofi() {

    /* Stop the other music first */

    if (!audio.paused) {
        audio.pause();
    }

    if (lofiAudio.paused) {

        lofiAudio.play()
        .then(function() {

            lofiPlayIcon.className = "pause-icon";

            lofiButtonText.textContent =
                "Pause Lofi Sample";

            status.textContent =
                "Playing Lofi Sample...";

        })
        .catch(function(error) {

            status.textContent =
                "Lofi sample could not be played.";

            console.log(error);

        });

    } else {

        lofiAudio.pause();

        lofiPlayIcon.className =
            "play-icon";

        lofiButtonText.textContent =
            "Play Lofi Sample";

        status.textContent =
            "Paused";

    }

}


/* LOFI PLAY EVENT */

lofiAudio.addEventListener("play", function() {

    lofiPlayIcon.className =
        "pause-icon";

    lofiButtonText.textContent =
        "Pause Lofi Sample";

    status.textContent =
        "Playing Lofi Sample...";

});


/* LOFI PAUSE EVENT */

lofiAudio.addEventListener("pause", function() {

    if (!lofiAudio.ended) {

        lofiPlayIcon.className =
            "play-icon";

        lofiButtonText.textContent =
            "Play Lofi Sample";

    }

});


/* LOFI FINISHED */

lofiAudio.addEventListener("ended", function() {

    lofiPlayIcon.className =
        "play-icon";

    lofiButtonText.textContent =
        "Play Lofi Sample";

    status.textContent =
        "Lofi sample finished";

});


/* 1-MINUTE LIMIT */

lofiAudio.addEventListener("timeupdate", function() {

    if (lofiAudio.currentTime >= 60) {

        lofiAudio.pause();

        lofiAudio.currentTime = 0;

        lofiPlayIcon.className =
            "play-icon";

        lofiButtonText.textContent =
            "Play Lofi Sample";

        status.textContent =
            "1-minute preview finished";

    }

});

</script>
