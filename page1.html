    <!-- LOADING BOTH FONTS (Outfit for 'hyfted', Great Vibes for everything else) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@600;900&display=swap" rel="stylesheet">

    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
            /* CURSIVE AS THE BASE FONT FOR THE PAGE */
            font-family: 'Great Vibes', cursive;

            /* GEMINI-INSPIRED RAINBOW GRADIENT */
            background: linear-gradient(
                135deg, 
                #1a73e8, 
                #7c4dff, 
                #9c27b0, 
                #e040fb, 
                #1a73e8
            );
            background-size: 300% 300%;
            animation: geminiWave 6s ease-in-out infinite;
        }

        .container {
            text-align: center;
            padding: 0 15px; 
            max-width: 500px; 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* KEEPING "HYFTED" IN THE CLEAN READABLE GEOMETRIC FONT */
        .logo-title {
            font-family: 'Outfit', sans-serif;
            font-size: 4.5rem; 
            font-weight: 900; 
            letter-spacing: -2px; 
            text-transform: lowercase; 
            margin-bottom: 30px; 

            /* GLOWING TEXT GRADIENT */
            background: linear-gradient(270deg, #ffffff, #a5f3fc, #fbcfe8, #ffffff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Color shift + Floating movement */
            animation: moveTextGradient 4s ease infinite, floatLogo 3s ease-in-out infinite;
        }

        /* LOWER TEXT BLOCKS STAY AUTOMATICALLY IN CURSIVE */
        h1 {
            font-size: 3.5rem; 
            margin-bottom: 5px;
            background: linear-gradient(270deg, #ffffff, #a5f3fc, #fbcfe8, #ffffff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveTextGradient 5s ease infinite;
        }

        p {
            font-size: 1.8rem; 
            line-height: 1.2;
            margin-bottom: 35px; /* Added spacing above the button */
            background: linear-gradient(270deg, #ffffff, #a5f3fc, #fbcfe8, #ffffff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveTextGradient 6s ease infinite;
        }

        /* 1. BUTTON STYLING (Uses Outfit font for crisp readability) */
        .next-btn {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #ffffff;
            text-decoration: none; /* Removes default link underline */
            
            /* Sizing & Shape */
            padding: 12px 35px;
            border-radius: 50px;
            
            /* Glassmorphism Styling */
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            /* Smooth animations */
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* 2. HOVER EFFECT FOR BUTTON */
        .next-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05); /* Bounces slightly larger */
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        /* BACKGROUND TIMELINE */
        @keyframes geminiWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* TEXT GRADIENT TIMELINE */
        @keyframes moveTextGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* FLOATING TIMELINE FOR THE TOP TEXT */
        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); } 
            100% { transform: translateY(0px); }
        }
    </style>
</head>
