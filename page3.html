    <div class="container">
        <h1>Breathe & Relax</h1>

        <!-- The Countdown Window -->
        <div class="timer-display" id="timer">01:00</div>

        <div class="btn-group">
            <button class="control-btn" id="startBtn" onclick="toggleTimer()">Start Timer</button>
            <button class="control-btn" onclick="resetTimer()">Reset</button>
        </div>

    <!-- JAVASCRIPT: Handles the functional countdown clock logic -->
    <script>
        let countdown;
        let timeLeft = 60; // 1-minute countdown timer
        let isRunning = false;

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');

        function updateDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            timerDisplay.textContent = `${minutes}:${seconds}`;
        }

        function toggleTimer() {
            if (isRunning) {
                // Pause action
                clearInterval(countdown);
                isRunning = false;
                startBtn.textContent = "Start Timer";
                startBtn.classList.remove('start-active');
                timerDisplay.classList.remove('pulsing');
            } else {
                // Start action
                isRunning = true;
                startBtn.textContent = "Pause";
                startBtn.classList.add('start-active');
                timerDisplay.classList.add('pulsing');

                countdown = setInterval(() => {
                    timeLeft--;
                    updateDisplay();

                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        isRunning = false;
                        timeLeft = 60; // reset back to 1 minute
                        updateDisplay();
                        startBtn.textContent = "Start Timer";
                        startBtn.classList.remove('start-active');
                        timerDisplay.classList.remove('pulsing');
                        alert("Great job! Your 1-minute mindfulness window is complete.");
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(countdown);
            isRunning = false;
            timeLeft = 60;
            updateDisplay();
            startBtn.textContent = "Start Timer";
            startBtn.classList.remove('start-active');
            timerDisplay.classList.remove('pulsing');
        }
    </script>
