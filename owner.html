<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Owner — Hyfted</title>

    <!-- BRAND FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;900&display=swap"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            background:
                linear-gradient(
                    135deg,
                    #1677ff,
                    #6246ea,
                    #9b36d6,
                    #e33cff,
                    #ff5fcf,
                    #ff72b6,
                    #7c5cff,
                    #29c6ff,
                    #1677ff
                );

            background-size: 500% 500%;

            animation:
                geminiWave
                6s ease-in-out infinite;

        }


        /* ==========================================
           OWNER CARD
        ========================================== */

        .owner-container {

            width: 100%;

            max-width: 700px;

            text-align: center;

            padding: 45px 30px;

            border-radius: 30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:
                0 15px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.15
                );

        }


        /* ==========================================
           HYFTED BRAND NAME
           KEEPING BRAND FONT
        ========================================== */

        .brand {

            font-family:
                'Outfit',
                sans-serif;

            font-size:
                4.5rem;

            font-weight:
                900;

            letter-spacing:
                -2px;

            margin-bottom:
                20px;

            background:
                linear-gradient(
                    270deg,
                    #ffffff,
                    #a5f3fc,
                    #fbcfe8,
                    #ffffff
                );

            background-size:
                400% 400%;

            -webkit-background-clip:
                text;

            -webkit-text-fill-color:
                transparent;

            animation:
                moveTextGradient
                4s ease infinite;

        }


        /* ==========================================
           ALL OTHER TEXT — ARIAL
        ========================================== */

        h1 {

            font-family:
                Arial,
                sans-serif;

            font-size:
                2.5rem;

            margin-bottom:
                25px;

        }


        p {

            font-family:
                Arial,
                sans-serif;

            font-size:
                1.1rem;

            line-height:
                1.7;

            margin-bottom:
                18px;

        }


        .label {

            font-family:
                Arial,
                sans-serif;

            font-weight:
                bold;

        }


        .about {

            margin-top:
                25px;

        }


        .back-link {

            display:
                inline-block;

            margin-top:
                20px;

            font-family:
                Arial,
                sans-serif;

            color:
                white;

            text-decoration:
                underline;

            font-weight:
                bold;

        }


        .back-link:hover {

            opacity:
                0.75;

        }


        /* ==========================================
           BACKGROUND ANIMATION
        ========================================== */

        @keyframes geminiWave {

            0% {
                background-position: 0% 50%;
            }

            20% {
                background-position: 35% 30%;
            }

            40% {
                background-position: 70% 50%;
            }

            60% {
                background-position: 100% 70%;
            }

            80% {
                background-position: 55% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        @keyframes moveTextGradient {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* ==========================================
           IPAD / PHONE
        ========================================== */

        @media (max-width: 600px) {

            body {
                padding: 25px 15px;
            }

            .owner-container {
                padding: 35px 20px;
            }

            .brand {
                font-size: 3.8rem;
            }

            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }

        }

    </style>

</head>


<body>


    <div class="owner-container">


        <!-- HYFTED BRAND -->

        <div class="brand">
            hyfted
        </div>


        <h1>
            Owner
        </h1>


        <p>
            <span class="label">Owner:</span>
            Brennan Magdziarz
        </p>


        <p>
            <span class="label">Website:</span>
            Hyfted.com
        </p>


        <p class="about">
            <span class="label">About:</span>
            App is still in BETA and will continue to improve.
        </p>


        <a
            href="index.html"
            class="back-link">

            Back to Hyfted

        </a>


    </div>


</body>

</html>
