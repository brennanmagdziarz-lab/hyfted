<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner - Hyfted</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Outfit:wght@600;900&family=Parisienne&display=swap"
    rel="stylesheet">


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    padding: 40px 20px;

    font-family:
        'Outfit',
        sans-serif;

    color: white;

    text-align: center;

    background:
        linear-gradient(
            135deg,
            #1677ff,
            #6246ea,
            #9b36d6,
            #e33cff,
            #ff5fcf,
            #ff72b6,
            #7c5cff,
            #29c6ff,
            #1677ff
        );

    background-size:
        500% 500%;

    animation:
        geminiWave
        6s ease-in-out infinite;

}


.container {

    max-width:
        650px;

    margin:
        70px auto 0;

    padding:
        40px 30px;

    border-radius:
        30px;

    background:
        rgba(
            255,
            255,
            255,
            0.16
        );

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.3
        );

    box-shadow:
        0 15px 40px
        rgba(
            0,
            0,
            0,
            0.18
        );

}


.logo {

    font-size:
        3.5rem;

    font-weight:
        900;

    margin-bottom:
        20px;

}


h1 {

    font-family:
        'Parisienne',
        cursive;

    font-size:
        4rem;

    font-weight:
        400;

    margin:
        10px 0 30px;

}


.info {

    font-family:
        'Kalam',
        cursive;

    font-size:
        1.5rem;

    line-height:
        1.7;

}


.info strong {

    font-family:
        'Outfit',
        sans-serif;

}


.beta {

    margin-top:
        25px;

    padding:
        20px;

    border-radius:
        20px;

    background:
        rgba(
            0,
            0,
            0,
            0.15
        );

    font-size:
        1.1rem;

}


.back {

    display:
        inline-block;

    margin-top:
        30px;

    color:
        white;

    text-decoration:
        underline;

    font-weight:
        700;

}


@keyframes geminiWave {

    0% {
        background-position:
            0% 50%;
    }

    20% {
        background-position:
            35% 30%;
    }

    40% {
        background-position:
            70% 50%;
    }

    60% {
        background-position:
            100% 70%;
    }

    80% {
        background-position:
            55% 50%;
    }

    100% {
        background-position:
            0% 50%;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="logo">

        hyfted

    </div>


    <h1>

        Owner

    </h1>


    <div class="info">

        <p>
            <strong>Owner:</strong>
            Brennan Magdziarz
        </p>


        <p>
            <strong>Website:</strong>
            Hyfted.com
        </p>


        <div class="beta">

            <strong>About:</strong>

            <br>

            App is still in BETA and will continue to improve.

        </div>

    </div>


    <a
        href="page1.html"
        class="back">

        ← Back to Home

    </a>


</div>


</body>

</html>
