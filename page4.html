    <!-- LOADING FONTS -->

    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Great Vibes', cursive;
            
            /* MATCHING GEMINI BACKGROUND FROM THE OTHER PAGES */
            background: linear-gradient(135deg, #1a73e8, #7c4dff, #9c27b0, #e040fb, #1a73e8);
            background-size: 300% 300%;
            animation: geminiWave 6s ease-in-out infinite;
            padding: 40px 15px;
        }

        .container { 
            text-align: center; 
            padding: 35px 25px; 
            max-width: 500px; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 5px;
            background: linear-gradient(270deg, #ffffff, #a5f3fc, #fbcfe8, #ffffff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveTextGradient 5s ease infinite;
        }

        .subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* MOOD SELECTOR WIDGET */
        .mood-box {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .mood-btn {
            font-size: 2rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease;
            padding: 5px;
        }

        .mood-btn:hover {
            transform: scale(1.25);
        }

        /* INPUT TEXT AREA */
        textarea {
            width: 100%;
            height: 120px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            outline: none;
            resize: none;
            margin-bottom: 20px;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .control-btn, .back-btn {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-block;
        }

        .control-btn:hover, .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .save-btn {
            background: rgba(165, 243, 252, 0.25);
            border-color: #a5f3fc;
        }

        /* ANIMATIONS */
        @keyframes geminiWave { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes moveTextGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body>

    <div class="container">

    <div class="container">
        <h1>Daily Reflection</h1>
        <p class="subtitle">How are you feeling right now?</p>

        <!-- Interactive Mood Picker -->
        <div class="mood-box">
            <button class="mood-btn" onclick="selectMood('😌')">😌</button>
            <button class="mood-btn" onclick="selectMood('😊')">😊</button>
            <button class="mood-btn" onclick="selectMood('🌿')">🌿</button>
            <button class="mood-btn" onclick="selectMood('😴')">😴</button>
            <button class="mood-btn" onclick="selectMood('🤯')">🤯</button>
        </div>

        <!-- Text Input Field -->
        <textarea id="journalInput" placeholder="Write down a quick thought to clear your mind..."></textarea>

        <!-- PASTE THIS INSTEAD -->
<div class="btn-group">
    <a href="page3.html" class="back-btn">Go Back</a>
    <button class="control-btn save-btn" onclick="saveEntry()">Save Entry</button>
    <a href="page5.html" class="back-btn" style="background: rgba(165, 243, 252, 0.25); border-color: #a5f3fc;">Talk to AI</a>
</div>

    </div>

    <!-- JAVASCRIPT: Handles clicking emojis and saving entries -->
    <script>
        let chosenMood = "";

        function selectMood(emoji) {
            chosenMood = emoji;
            alert("Mood set to: " + emoji);
        }

        function saveEntry() {
            const text = document.getElementById('journalInput').value;
            
            if (!text && !chosenMood) {
                alert("Please select a mood or write a thought first!");
                return;
            }

            alert("Your reflection has been successfully saved to your mind! ✨");
            
            // Clear out the input area for next time
            document.getElementById('journalInput').value = "";
            chosenMood = "";
        }
    </script>
