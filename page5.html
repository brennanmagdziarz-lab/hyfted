    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Great Vibes', cursive;
            
            /* MATCHING GEMINI BACKGROUND FROM THE OTHER PAGES */
            background: linear-gradient(135deg, #1a73e8, #7c4dff, #9c27b0, #e040fb, #1a73e8);
            background-size: 300% 300%;
            animation: geminiWave 6s ease-in-out infinite;
            padding: 20px 15px;
        }

        .container { 
            text-align: center; 
            padding: 25px; 
            max-width: 550px; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            height: 85vh; 
        }

        /* ULTRA-READABLE TITLE STYLE FOR HYFTED AI */
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 15px;
            
            /* GLOWING TEXT GRADIENT */
            background: linear-gradient(270deg, #ffffff, #a5f3fc, #fbcfe8, #ffffff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveTextGradient 5s ease infinite;
        }

        /* CHAT INTERFACE WINDOW */
        .chat-window {
            flex: 1;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 18px;
            padding: 20px;
            overflow-y: auto; 
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 14px; /* Increased slightly to handle oversized bounce expansion safely */
            text-align: left;
            font-family: 'Outfit', sans-serif;
        }

        /* APPLE IMESSAGE STYLE BUBBLES */
        .message {
            max-width: 70%; 
            padding: 12px 18px;
            font-size: 1rem;
            line-height: 1.4;
            color: #ffffff;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* 💥 USER BUBBLE: Exaggerated elastic pop-up springing up from 0% to 115% scale */
        .user-msg {
            background: #007aff; 
            align-self: flex-end; 
            border-radius: 20px 20px 4px 20px; 
            transform-origin: bottom right; 
            animation: extraPopUser 0.35s cubic-bezier(0.34, 1.8, 0.64, 1) forwards;
        }

        /* 💥 AI BUBBLE: Exaggerated long-distance slide up coupled with a dramatic fade-in lift */
        .ai-msg {
            background: rgba(255, 255, 255, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            align-self: flex-start; 
            border-radius: 20px 20px 20px 4px; 
            color: #ffffff;
            opacity: 0; 
            transform-origin: bottom left;
            animation: extraSlideAI 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4) forwards;
        }

        /* INPUT CONTROL BAR */
        .input-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            padding: 12px 20px;
            border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* BUTTONS */
        .send-btn, .nav-btn {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .send-btn:hover, .nav-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.03);
        }

        .send-btn {
            background: #ffffff;
            color: #007aff;
            border: none;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* 🎬 EXAGGERATED SPRING TIMELINES */
        @keyframes extraPopUser {
            0% { transform: scale(0.2); opacity: 0; }
            65% { transform: scale(1.12); } /* Overshoots normal size with a big expansion stretch */
            85% { transform: scale(0.96); } /* Bounces back lower slightly */
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes extraSlideAI {
            0% { transform: translateY(50px) scale(0.7); opacity: 0; } /* Starts way lower and smaller */
            70% { transform: translateY(-5px) scale(1.05); opacity: 0.85; } /* Rockets up past its target anchor */
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* GLOBAL SCREEN ANIMATIONS */
        @keyframes geminiWave { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes moveTextGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>

    <div class="container">
        <h1>Hyfted AI</h1>
        
        <div class="chat-window" id="chatBox">
            <div class="message ai-msg">Hello! I am your calming AI assistant. How are you feeling today? 🌿</div>
        </div>

        <div class="input-bar">
            <input type="text" id="userInput" placeholder="iMessage..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return; 

            appendMessage(text, 'user-msg');
            userInput.value = ""; 

            setTimeout(() => {
                const aiResponse = getAIResponse(text);
                appendMessage(aiResponse, 'ai-msg');
            }, 1000); 
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', className);
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getAIResponse(input) {
            const lowerInput = input.toLowerCase();
            
            if (lowerInput.includes('sad') || lowerInput.includes('bad') || lowerInput.includes('stressed')) {
                return "I'm sorry you're feeling that way. Try opening our Breathing Timer on Page 3 for a quick mental reset. You've got this! 💙";
            }
            if (lowerInput.includes('happy') || lowerInput.includes('good') || lowerInput.includes('great')) {
                return "That's wonderful to hear! Remember to log this positive energy inside your Journal on Page 4! ✨";
            }
            if (lowerInput.includes('hello') || lowerInput.includes('hi') || lowerInput.includes('hey')) {
                return "Hello there! I'm here to listen. Tell me about your day or how your mindset is tracking.";
            }
            
            return "Thank you for sharing that with me. Take a deep breath, listen to some ambient tracks on Page 2, and remember to look after yourself today. 🧘";
        }
    </script>
