    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Great Vibes', cursive;
            
            /* SIGNATURE GEMINI MOVING RAINBOW BACKGROUND */
            background: linear-gradient(135deg, #1a73e8, #7c4dff, #9c27b0, #e040fb, #1a73e8);
            background-size: 300% 300%;
            animation: geminiWave 6s ease-in-out infinite;
            padding: 20px 15px;
            overflow: hidden;
        }

        /* LUXURY FLOATING GLASS CONTAINER BLOCK */
        .container { 
            text-align: center; 
            padding: 40px 30px; 
            max-width: 500px; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* DYNAMIC GEMINI ANIMATED GRADIENT HEADER */
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 30px;
            
            background: linear-gradient(270deg, #ffffff, #a5f3fc, #fbcfe8, #ffffff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveTextGradient 5s ease infinite;
        }

        /* 🌌 VISUALIZER ZONE */
        .stage-box {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 35px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ⚖️ NEW WRAPPER LAYER: Handles the 14-second breathing loop and 1-minute expiration cleanly */
        .nebula-wrapper {
            position: absolute;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: 
                corePulse 14s infinite ease-in-out,
                oneMinuteLimit 60s forwards;
        }

        /* THE SMOOTH & WAVY SHAPE CORE: Handles the fluid liquid color morphs */
        .nebula-core {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f2fe, #7c4dff, #e040fb, #00f2fe);
            background-size: 400% 400%;
            mix-blend-mode: screen;
            
            animation: 
                liquidMorph 6s ease-in-out infinite,
                gradientShift 4s linear infinite;
        }

        /* Star trails tracking wavy paths around the shifting nebula core */
        .star-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffffff, 0 0 20px #00f2fe;
            animation: starOrbit 14s infinite ease-in-out, oneMinuteLimit 60s forwards;
        }
        .star-dot:nth-child(2) { --angle: 45deg; --dist: 55px; --expand: 120px; }
        .star-dot:nth-child(3) { --angle: 135deg; --dist: 70px; --expand: 140px; }
        .star-dot:nth-child(4) { --angle: 225deg; --dist: 85px; --expand: 160px; width: 4px; height: 4px; }
        .star-dot:nth-child(5) { --angle: 315deg; --dist: 100px; --expand: 180px; }

        /* TIMED TEXT PROMPT CONTAINER LAYER */
        .prompt-container {
            position: relative;
            margin-bottom: 35px;
            min-height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* HARDWARE TEXT ITEMS */
        .text-item {
            position: absolute;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 2.4rem; 
            letter-spacing: 2px;
            text-transform: uppercase;
            
            background: linear-gradient(270deg, #ffffff, #a5f3fc, #fbcfe8, #ffffff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveTextGradient 4s ease infinite, textTimeline 14s infinite ease-in-out;
            opacity: 0; 
        }

        .text-item.in    { animation-delay: 0s, 0s; }
        .text-item.hold1 { animation-delay: 0s, 4s; }
        .text-item.out   { animation-delay: 0s, 7s; }
        .text-item.hold2 { animation-delay: 0s, 11s; }

        /* BACK NAV FOOTER LINKS */
        .nav-links {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .nav-btn {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* 🎬 PERFORMANCE KEYFRAMES */
        @keyframes geminiWave { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes moveTextGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        @keyframes liquidMorph {
            0%, 100% { border-radius: 50% 50% 50% 50%; }
            33% { border-radius: 40% 60% 45% 55% / 55% 40% 60% 45%; }
            66% { border-radius: 55% 45% 60% 40% / 45% 55% 40% 60%; }
        }

        /* ⚖️ SHAPE BREATHE TIMELINE: 4s expand -> 3s hold -> 4s shrink -> 3s hold */
        @keyframes corePulse {
            0%, 100% { transform: scale(0.65); }
            28.5% { transform: scale(1.9); }  /* Peak expansion at 4s */
            50% { transform: scale(1.9); }      /* WAITS 3 SECONDS BEFORE SHRINKING: Frozen open from second 4 to 7 */
            78.5% { transform: scale(0.65); }  /* Deflates back down across 4s */
        }

        @keyframes starOrbit {
            0%, 100% { transform: rotate(0deg) translate(var(--dist)) scale(0.8); }
            28.5% { transform: rotate(90deg) translate(var(--expand)) scale(1.3); }
            50% { transform: rotate(180deg) translate(var(--expand)) scale(1.3); }
            78.5% { transform: rotate(270deg) translate(var(--dist)) scale(0.8); }
        }

        /* 🛑 1-MINUTE TIME-LIMIT STOP */
        @keyframes oneMinuteLimit {
            0%, 99.9% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* 📢 HARDWARE-DRIVEN TEXT SWITCHER SYSTEM (14s loop cycle) */
        @keyframes textTimeline {
            0% { opacity: 0; transform: scale(0.9); }
            2% { opacity: 1; transform: scale(1); }
            26% { opacity: 1; transform: scale(1.03); }
            28.5%, 100% { opacity: 0; transform: scale(0.9); }
        }
    </style>
</head>
